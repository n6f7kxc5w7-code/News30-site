name: Trigger ingest
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        run:
          curl -sS -L --fail-with-body -X POST https://www.news30.live/api/cron/ingest \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
