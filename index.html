<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Prevents a white flash before the app's styles mount -->
    <style>
      html,
      body {
        background: #0f0f0f;
      }
    </style>
    <!-- seo:start — api/seo.js replaces everything up to seo:end per page -->
    <title>News30 — AI-condensed news in 30 seconds</title>
    <meta
      name="description"
      content="News30 condenses the day's top geopolitics, finance and sports stories into 30-second AI video summaries, with the original source credited and linked on every story."
    />
    <link rel="canonical" href="https://www.news30.live/" />
    <meta property="og:site_name" content="News30" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.news30.live/" />
    <meta property="og:title" content="News30 — AI-condensed news in 30 seconds" />
    <meta
      property="og:description"
      content="The day's top geopolitics, finance and sports stories as 30-second AI video summaries, with the original source credited on every story."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="News30 — AI-condensed news in 30 seconds" />
    <meta
      name="twitter:description"
      content="The day's top geopolitics, finance and sports stories as 30-second AI video summaries, with the original source credited on every story."
    />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
